name: Python Matrix
on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/tests.yml"
      - "pyproject.toml"
      - "lib/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - "pyproject.toml"
      - "lib/**"
      - "tests/**"
jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and test deps
        run: python -m pip install -e .[dev]
      - name: Import smoke checks
        run: python -c "import snapfs; from snapfs import cli, scanner, gateway, agent; print('snapfs import smoke OK')"
      - name: Run unit tests
        run: pytest -q
      - name: CLI help smoke check
        run: snapfs --help
